<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="title desc">
  <title id="title">ADD · 灵感收藏夹</title><desc id="desc">用提示词、风格图片、教程链接三张卡片收藏未来创作的灵感。</desc>
  <defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#79896c" opacity=".15"/></pattern><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dy="9" stdDeviation="8" flood-color="#142218" flood-opacity=".15"/></filter></defs>
  <rect width="680" height="410" fill="#e7eadf"/><rect width="680" height="410" fill="url(#dots)"/>
  <circle cx="366" cy="215" r="143" fill="none" stroke="#b4bea8" stroke-dasharray="3 9"/>
  <g font-family="Inter, Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="43" y="87" fill="#25382c" font-size="44" font-weight="800" letter-spacing="-2">add<tspan fill="#f16e42">✳</tspan></text>
    <text x="45" y="109" fill="#65755f" font-size="10" letter-spacing="2">SAVE IT. CREATE LATER.</text>
    <g transform="translate(423 122) rotate(12)" filter="url(#shadow)"><rect width="164" height="186" rx="8" fill="#f5dca7" stroke="#d9c593"/><text x="15" y="27" fill="#786440" font-size="10" letter-spacing="1">03 / LEARN</text><path d="M18 52H121M18 65H87" stroke="#b9a374" stroke-width="5" stroke-linecap="round"/><text x="61" y="135" fill="#836840" font-size="53">↗</text><text x="18" y="165" fill="#786440" font-size="11">教程链接</text></g>
    <g transform="translate(299 78) rotate(-4)" filter="url(#shadow)"><rect width="165" height="206" rx="8" fill="#f5f3eb" stroke="#cbd1c1"/><text x="15" y="27" fill="#718067" font-size="10" letter-spacing="1">02 / SEE</text><rect x="14" y="42" width="137" height="128" rx="3" fill="#d9e4cf"/><circle cx="72" cy="106" r="35" fill="#8eaa78"/><path d="M89 69L133 150H46Z" fill="#e8c890"/><rect x="82" y="105" width="43" height="49" rx="22" fill="#d86d45"/><text x="17" y="190" fill="#718067" font-size="11">风格图片</text></g>
    <g transform="translate(136 139) rotate(-10)" filter="url(#shadow)"><rect width="194" height="195" rx="8" fill="#2e4435"/><text x="17" y="28" fill="#b5c5ab" font-size="10" letter-spacing="1">01 / PROMPT</text><text x="15" y="94" fill="#d7e4bd" font-size="57" font-family="Georgia, serif">“</text><text x="28" y="92" fill="#f1f3e8" font-size="24" font-weight="600">一个想法，</text><text x="28" y="125" fill="#f1f3e8" font-size="24" font-weight="600">无限种表达<tspan fill="#f0c36a">_</tspan></text><path d="M23 150H171" stroke="#4b6350"/><text x="24" y="174" fill="#b5c5ab" font-size="11">提示词 · 留下好用的表达</text></g>
    <g transform="translate(536 68) rotate(9)"><circle r="31" fill="#f37346"/><text x="0" y="11" text-anchor="middle" fill="#fff5e5" font-size="30" font-weight="700">+1</text></g>
    <text x="384" y="349" fill="#41583b" font-size="14" font-weight="500">此刻收藏，下次创造。</text>
  </g>
</svg>
