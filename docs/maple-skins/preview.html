<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f1de"><title>冒险岛 V3 · 皮肤预览</title><link rel="stylesheet" href="preview.css"><link id="skinSheet" rel="stylesheet" href="skins/v3/skin.css"><link id="patchSheet" rel="stylesheet" href="skins/v3/patches.css"></head>
